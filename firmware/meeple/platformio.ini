; ESP-01. Framework Arduino, como en las prácticas.
; El módulo puede ser de 512 KB (esp01) o de 1 MB (esp01_1m).
; Por defecto se compila esp01_1m. Si no arranca:
;   pio run -e esp01 -t upload

[platformio]
default_envs = esp01_1m

[env]
platform = espressif8266
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dout
build_flags =
    -D MQTT_MAX_PACKET_SIZE=256
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    knolleary/PubSubClient @ ^2.8

[env:esp01]
board = esp01

[env:esp01_1m]
board = esp01_1m
