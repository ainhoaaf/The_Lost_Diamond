; Estación. ESP32 con el framework Arduino, que ya incluye FreeRTOS.
; En el Arduino IDE esta placa es DOIT ESP32 DEVKIT V1.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    knolleary/PubSubClient @ ^2.8
build_flags =
    -D MQTT_MAX_PACKET_SIZE=512
